<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* Grey Light Lab — Government Monitoring Aesthetic */
/* Brand: deep slate teal — authoritative, precise, civic */

:root {
  /* === Background & Surfaces === */
  --brand-background: #f4f5f7;
  --brand-surface: #ffffff;
  --brand-surface-2: #ebedf0;
  --brand-popover: #ffffff;

  /* === Foreground / Text === */
  --brand-foreground: #1a2332;
  --brand-card-foreground: #1a2332;
  --brand-popover-foreground: #1a2332;
  --brand-muted: #ebedf0;
  --brand-muted-foreground: #5a6678;
  --brand-card: #ffffff;

  /* === Brand Primary (Deep Slate Teal) === */
  --brand-primary: #1d6b6b;
  --brand-primary-foreground: #ffffff;

  /* === Borders / Inputs === */
  --brand-border: #d4d9e0;
  --brand-input: #d4d9e0;
  --brand-ring: #1d6b6b;

  /* === Radius === */
  --brand-radius-sm: 2px;
  --brand-radius-md: 4px;
  --brand-radius-lg: 8px;

  /* === State Colors === */
  --state-success: #2e7d32;
  --state-warning: #e65100;
  --state-error: #c62828;
  --state-info: #1565c0;

  /* === Extended Tokens === */
  --ink: #1a2332;
  --ink-2: #5a6678;
  --ink-3: #8b95a4;
  --line: #d4d9e0;
  --surface: #ffffff;
  --surface-2: #ebedf0;
  --bg: #f4f5f7;
  --brand: #1d6b6b;
  --brand-ink: #ffffff;

  /* Typography */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "Courier New", monospace;

  /* Spacing (8pt grid) */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;

  /* Radius */
  --r-xs: 2px;
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 16px;
  --r-pill: 999px;

  /* Borders & Shadows */
  --border: 1px solid var(--line);
  --shadow-1: 0 1px 2px rgba(15,23,42,.04), 0 1px 1px rgba(15,23,42,.02);
  --shadow-2: 0 8px 24px -8px rgba(15,23,42,.12);
  --shadow-3: 0 24px 60px -20px rgba(15,23,42,.20);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
