<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灰灯实验室 AI 鉴定台 · 离线演示站</title>
  <meta name="description" content="水生生物 AI 鉴定平台离线演示站 · 政务监测报告风格 · 无需联网即可运行全部功能。">
  <meta http-equiv="refresh" content="0; url=pages/index.html">
  <link rel="canonical" href="pages/index.html">
  <style>
    :root {
      --brand-background: #f4f5f7;
      --brand-surface: #ffffff;
      --brand-foreground: #1a2332;
      --brand-primary: #1d6b6b;
      --brand-border: #d4d9e0;
      --ink-2: #5a6678;
      --ink-3: #8b95a4;
      --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --shadow-1: 0 1px 2px rgba(15, 23, 42, .04), 0 1px 1px rgba(15, 23, 42, .02);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--brand-background);
      color: var(--brand-foreground);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      text-align: center;
      background: var(--brand-surface);
      border: 1px solid var(--brand-border);
      border-radius: 8px;
      box-shadow: var(--shadow-1);
    }
    .mark {
      width: 44px;
      height: 44px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: var(--brand-primary);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -.02em;
    }
    h1 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
    .sub { margin: 0 0 20px; font-size: 12px; color: var(--ink-3); }
    .hint {
      margin: 0 0 18px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--ink-2);
      background: var(--brand-background);
      border: 1px solid var(--brand-border);
      border-radius: 4px;
    }
    a.go {
      display: inline-block;
      padding: 9px 22px;
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      text-decoration: none;
      background: var(--brand-primary);
      border-radius: 4px;
    }
    a.go:hover { background: #175757; }
    .foot { margin: 20px 0 0; font-size: 11px; color: var(--ink-3); }
  </style>
  <script>location.replace('pages/index.html');</script>
</head>
<body>
  <div class="card">
    <div class="mark">灰</div>
    <h1>灰灯实验室 AI 鉴定台</h1>
    <p class="sub">水生生物 AI 鉴定平台 · 离线演示站</p>
    <p class="hint">正在跳转到演示首页……如果没有自动跳转，请点击下面的按钮。</p>
    <a class="go" href="pages/index.html">进入演示首页</a>
    <p class="foot">v1.5 · 离线 Demo</p>
  </div>
</body>
</html>
